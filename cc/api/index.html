<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNIS Quotation API</title>
  <style>
    body { margin: 0; background: #fafafa; }
    .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid #e0e0e0; background: #fff;
           font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #181818; }
    .bar b { font-size: 15px; }
    .bar a { color: #763abf; }
    .bar .sp { flex: 1; }
  </style>
</head>
<body>
  <div class="bar">
    <b>UNIS Fulfillment Quotation API</b>
    <span class="sp"></span>
    <a href="openapi.yaml">openapi.yaml</a>
    <a href="openapi.json">openapi.json</a>
    <a href="../">Quotation app</a>
  </div>
  <redoc spec-url="openapi.yaml"></redoc>
  <script>
    // ITEM purple for actions; Redoc reads the theme from a JSON attribute
    document.querySelector("redoc").setAttribute("theme", JSON.stringify({
      colors: { primary: { main: "#763abf" } },
      typography: { fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif", headings: { fontWeight: "600" } },
      sidebar: { backgroundColor: "#f2f2f2" }, rightPanel: { backgroundColor: "#181818" }
    }));
  </script>
  <script src="https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js"></script>
</body>
</html>
