<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Webform Mockup</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --soft:#f2f4f7;
  --brand:#1f3864; --brand-2:#2f5aa8; --brand-soft:#e8eefb; --ok:#067647; --warn:#b54708; --warn-soft:#fef0c7;
  --b2b:#2f5aa8; --d2c:#b42387; --both:#475467; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
header input,header select{border:0;border-radius:6px;padding:6px 8px;font:inherit;min-width:160px}
header .sp{flex:1}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:34px;height:20px;border-radius:10px;background:#8da2c9;position:relative;transition:.15s}
.switch .track:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+.track{background:#4ade80}
.switch input:checked+.track:after{left:16px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;max-width:1280px;margin:0 auto;padding:20px}
nav{position:sticky;top:70px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
nav a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--soft)}
nav a .n{color:var(--muted);font-size:12px}
nav .sum{border-top:1px solid var(--line);margin-top:6px;padding:10px;font-size:12px;color:var(--muted)}
nav .sum b{color:var(--ink);font-size:18px;display:block}
section.cat{margin-bottom:28px}
section.cat>h2{font-size:18px;margin:0 0 2px}
section.cat>p{margin:0 0 10px;color:var(--muted)}
.charge{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.charge.on{border-color:var(--brand-2);box-shadow:0 0 0 1px var(--brand-2) inset}
.ch-head{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.ch-head .t{font-weight:600}
.ch-head .d{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;border:1px solid}
.badge.B2B{color:var(--b2b);border-color:var(--b2b)} .badge.D2C{color:var(--d2c);border-color:var(--d2c)} .badge.Both{color:var(--both);border-color:#c0c5cf}
.badge.new{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.bld{color:#fff;background:var(--brand-2);border-color:var(--brand-2)}
.price{display:flex;align-items:center;gap:6px;white-space:nowrap}
.price input{width:90px;text-align:right;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit}
.price .u{color:var(--muted);font-size:12px;min-width:84px}
.hint{color:var(--muted);font-size:11.5px}
.body{border-top:1px solid var(--line);padding:12px 16px 16px 48px}
.step{margin:4px 0 14px}
.step>.q{font-weight:600;margin-bottom:6px}
.step>.q .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;text-align:center;line-height:20px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:4px 11px;cursor:pointer;user-select:none;font-size:13px}
.chip:hover{border-color:#b9c3d6}
.chip.sel{background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand);font-weight:600}
.chip.small{font-size:12px;padding:2px 9px}
.more{color:var(--brand-2);cursor:pointer;font-size:12.5px;border:0;background:none;padding:4px 2px}
.more:hover{text-decoration:underline}
.vals{margin:6px 0 10px 12px;padding-left:10px;border-left:2px solid var(--brand-soft)}
.vals .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.unitbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fcfcfd}
.unitbox h4{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row .k{font-size:12.5px;color:var(--muted);min-width:118px}
.hidden-note{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px;display:inline-block;margin-top:6px}
table.rates{border-collapse:collapse;margin-top:8px;font-size:13px;min-width:320px}
table.rates th{background:var(--soft);text-align:left;font-weight:600;padding:5px 10px;border:1px solid var(--line);font-size:12px}
table.rates td{padding:4px 10px;border:1px solid var(--line)}
table.rates td input{width:84px;text-align:right;padding:3px 6px;border:1px solid var(--line);border-radius:5px;font:inherit}
table.rates tr.min td{background:#fafbfc;font-style:italic}
.adv{margin-top:6px}
.adv>summary{cursor:pointer;color:var(--brand-2);font-weight:600;padding:6px 2px;list-style:none}
.adv>summary::before{content:"▸ ";}
.adv[open]>summary::before{content:"▾ ";}
.settings select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
.out{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.out table{border-collapse:collapse;width:100%;font-size:12.5px}
.out th,.out td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left}
.out td.r{text-align:right}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{position:static}.body{padding-left:16px}}
</style>
</head>
<body>
<header>
  <h1>UNIS Fulfillment · Quotation</h1>
  <input placeholder="Customer name" value="Sample Customer Inc.">
  <select id="fac"></select>
  <span class="sp"></span>
  <label class="switch" title="Ignore show/hide rules and show every factor, unit and driver"><input type="checkbox" id="showAll"><span class="track"></span>Show all options</label>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const MODEL = /*__MODEL__*/null;
const S = { showAll:false, charges:{}, open:{} };        // UI state
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (x, pct) => x == null ? "" : pct ? Math.round(x*100) + "%" : x.toFixed(2);
const money = x => x == null ? "" : "$" + x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const all = [];
MODEL.categories.forEach(cat => cat.charges.forEach(c => { c.cat = cat.id; all.push(c); }));
const byId = Object.fromEntries(all.map(c => [c.id, c]));

function st(c){
  if (!S.charges[c.id]) S.charges[c.id] = { on:false, price:c.default, conds:{}, units:{}, prices:{}, moreConds:false, moreUnits:false, showAll:false, settings:{} };
  return S.charges[c.id];
}
const showAll = (c) => S.showAll || st(c).showAll;

// ---------- show / hide rules
function activeConds(c){                               // ticked factors with at least one value
  const s = st(c);
  return c.conds.filter(cd => s.conds[cd.id]?.on).map(cd => ({cd, values: cd.free ? (s.conds[cd.id].text||"").split(",").map(x=>x.trim()).filter(Boolean) : [...(s.conds[cd.id].values||[])]})).filter(x => x.values.length);
}
function passes(c, when){                              // when = {condId: [allowed values]}
  if (showAll(c)) return true;
  const act = Object.fromEntries(activeConds(c).map(x => [x.cd.id, x.values]));
  return Object.entries(when||{}).every(([k, allowed]) => !act[k] || act[k].some(v => allowed.includes(v)));
}

// ---------- rendering
function render(){
  $("#nav").innerHTML = MODEL.categories.map(cat => {
    const n = cat.charges.filter(c => st(c).on).length;
    return `<a href="#cat-${cat.id}"><span>${esc(cat.name)}</span><span class="n">${n ? n + " selected" : ""}</span></a>`;
  }).join("") + `<div class="sum"><b id="sumLines">0</b>rate lines in this quote<br><a href="#out" style="padding:4px 0">Preview quote lines ↓</a></div>`;
  $("#main").innerHTML = MODEL.categories.map(cat => {
    const main = cat.charges.filter(c => c.tier === "main"), adv = cat.charges.filter(c => c.tier !== "main");
    return `<section class="cat" id="cat-${cat.id}"><h2>${esc(cat.name)}</h2><p>${esc(cat.desc)}</p>
      ${main.map(chargeHTML).join("")}
      ${adv.length ? `<details class="adv" ${S.open[cat.id] || S.showAll ? "open" : ""} data-cat="${cat.id}"><summary>Advanced (${adv.length})</summary>${adv.map(chargeHTML).join("")}</details>` : ""}
    </section>`;
  }).join("") + `<section class="cat" id="out"><h2>Quote lines</h2><p>What the webform would save - one row per price cell.</p><div class="out">${outHTML()}</div></section>`;
  $("#sumLines").textContent = quoteLines().length;
}

// show-all keeps the guided choice as its starting point
function chosenDrivers(c, us){ return showAll(c) ? (us.drivers || new Set(us.driver ? [us.driver] : [])) : new Set(us.driver ? [us.driver] : []); }
function badge(ch){ return `<span class="badge ${ch}">${ch}</span>`; }

function chargeHTML(c){
  const s = st(c);
  const head = `<div class="ch-head">
      <input type="checkbox" data-act="on" data-c="${c.id}" ${s.on ? "checked" : ""}>
      <div><span class="t">${esc(c.name)}</span>${c.kind === "builder" ? `<span class="badge bld">builder</span>` : badge(c.channel)}${c.new ? `<span class="badge new">new</span>` : ""}
        <div class="d">${esc(c.desc)}</div></div>
      ${c.kind === "simple" ? `<div class="price">${c.pct ? "" : "$"}<input data-act="sp" data-c="${c.id}" value="${fmt(s.price, c.pct)}" ${s.on ? "" : "disabled"}>${c.pct ? "%" : ""}<span class="u">${c.pct ? "markup on cost" : /^one-time/i.test(c.unit) ? "one-time" : "per " + esc(c.unit)}<br><span class="hint">${fmt(c.lo,c.pct)}–${fmt(c.hi,c.pct)} · ${esc(c.basis)}</span></span></div>` : `<span class="hint">${c.units.length} units · ${c.conds.length} rate factors</span>`}
    </div>`;
  return `<div class="charge ${s.on ? "on" : ""}" id="ch-${c.id}">${head}${c.kind === "builder" && s.on ? builderHTML(c) : ""}</div>`;
}

function builderHTML(c){
  const s = st(c), sa = showAll(c);
  // Step 1 - rate factors
  const condShown = c.conds.filter(cd => cd.common || s.moreConds || sa || s.conds[cd.id]?.on);
  const hiddenConds = c.conds.length - condShown.length;
  let h = `<div class="step"><div class="q"><span class="num">1</span>Does the rate differ by …?</div><div class="chips">`
    + condShown.map(cd => `<span class="chip ${s.conds[cd.id]?.on ? "sel" : ""}" data-act="cond" data-c="${c.id}" data-k="${cd.id}" title="${esc(cd.help)}">${esc(cd.label)}</span>`).join("")
    + (hiddenConds ? `<button class="more" data-act="moreConds" data-c="${c.id}">+ ${hiddenConds} more factors</button>` : "")
    + `</div>`;
  c.conds.filter(cd => s.conds[cd.id]?.on).forEach(cd => {
    const sel = s.conds[cd.id].values || new Set();
    h += `<div class="vals"><div class="lbl">${esc(cd.label)} — which values get their own rate?</div>` + (cd.free
      ? `<input data-act="condText" data-c="${c.id}" data-k="${cd.id}" placeholder="type values, comma separated" value="${esc(s.conds[cd.id].text||"")}" style="width:320px;padding:4px 6px;border:1px solid var(--line);border-radius:6px">`
      : `<div class="chips">` + cd.values.map(v => `<span class="chip small ${sel.has(v) ? "sel" : ""}" data-act="condVal" data-c="${c.id}" data-k="${cd.id}" data-v="${esc(v)}">${esc(v)}</span>`).join("") + `</div>`) + `</div>`;
  });
  h += `</div>`;
  if (c.settings.length) {
    h += `<div class="step settings"><div class="q"><span class="num">·</span>Billing settings</div>` + c.settings.map(x =>
      `<div class="row"><span class="k">${esc(x.label)}</span><select data-act="setting" data-c="${c.id}" data-k="${x.id}">${x.options.map(o => `<option ${s.settings[x.id] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`).join("") + `</div>`;
  }
  // Step 2 - units
  const allowed = c.units.filter(u => passes(c, u.when));
  const shownU = allowed.filter(u => u.common || s.moreUnits || sa || s.units[u.id]?.on);
  const ruleHidden = c.units.filter(u => !passes(c, u.when));
  h += `<div class="step"><div class="q"><span class="num">2</span>Charge per …</div><div class="chips">`
    + shownU.map(u => `<span class="chip ${s.units[u.id]?.on ? "sel" : ""}" data-act="unit" data-c="${c.id}" data-k="${u.id}">${esc(u.label)}</span>`).join("")
    + (allowed.length > shownU.length ? `<button class="more" data-act="moreUnits" data-c="${c.id}">+ ${allowed.length - shownU.length} more units</button>` : "")
    + `</div>` + (ruleHidden.length ? `<div class="hidden-note">Hidden by your answers above: ${ruleHidden.map(u => esc(u.label)).join(", ")}</div>` : "") + `</div>`;
  // Step 3+ - per unit
  const units = c.units.filter(u => s.units[u.id]?.on && passes(c, u.when));
  if (units.length) h += `<div class="step"><div class="q"><span class="num">3</span>How is each unit priced?</div>` + units.map(u => unitHTML(c, u)).join("") + `</div>`;
  h += `<div class="row"><button class="more" data-act="localAll" data-c="${c.id}">${s.showAll ? "Back to guided mode" : "Show all options for this charge"}</button></div>`;
  return `<div class="body">${h}</div>`;
}

function unitHTML(c, u){
  const s = st(c), us = s.units[u.id], sa = showAll(c);
  const drivers = u.drivers.filter(d => passes(c, d.when));
  const hiddenD = u.drivers.filter(d => !passes(c, d.when));
  const chosen = chosenDrivers(c, us);
  let h = `<div class="unitbox"><h4>Per ${esc(u.label.toLowerCase())}</h4>`;
  if (u.drivers.length) {
    h += `<div class="row"><span class="k">Price varies by</span><div class="chips">`
      + (sa ? "" : `<span class="chip small ${!us.driver ? "sel" : ""}" data-act="driver" data-c="${c.id}" data-u="${u.id}" data-k="">Flat rate</span>`)
      + drivers.map(d => `<span class="chip small ${chosen.has(d.id) ? "sel" : ""}" data-act="driver" data-c="${c.id}" data-u="${u.id}" data-k="${d.id}" title="${esc(d.help)}">${esc(d.label)}${d.kind === "volume" ? " (volume)" : ""}</span>`).join("")
      + `</div></div>` + (hiddenD.length ? `<div class="hidden-note">Not applicable to your answers: ${hiddenD.map(d => esc(d.label)).join(", ")}</div>` : "");
    u.drivers.filter(d => chosen.has(d.id) && d.calc).forEach(d => {
      h += `<div class="row"><span class="k">${esc(d.label)} tiers</span><div class="chips">` + ["Range - whole receipt at its band", "Incremental - each unit at its band"].map(o =>
        `<span class="chip small ${(us.calc?.[d.id] || "Range - whole receipt at its band") === o ? "sel" : ""}" data-act="calc" data-c="${c.id}" data-u="${u.id}" data-k="${d.id}" data-v="${o}">${o}</span>`).join("") + `</div></div>`;
    });
  }
  if (u.mins.length) h += `<div class="row"><span class="k">Minimum charge</span><div class="chips">` + ["", ...u.mins].map(m =>
      `<span class="chip small ${(us.min || "") === m ? "sel" : ""}" data-act="min" data-c="${c.id}" data-u="${u.id}" data-k="${m}">${m ? "per " + m : "None"}</span>`).join("") + `</div></div>`;
  if (u.second) h += `<div class="row"><span class="k">Different rate for additional units?</span><div class="chips">` + ["No", "Yes"].map(o =>
      `<span class="chip small ${(us.second ? "Yes" : "No") === o ? "sel" : ""}" data-act="second" data-c="${c.id}" data-u="${u.id}" data-k="${o}">${o}</span>`).join("") + `</div></div>`;
  h += rateTable(c, u) + (u.note ? `<div class="hint">${esc(u.note)}</div>` : "") + `</div>`;
  return h;
}

// ---------- rate table generation
function rows(c, u){
  const s = st(c), us = s.units[u.id], sa = showAll(c);
  const ids = [...chosenDrivers(c, us)];
  const drivers = u.drivers.filter(d => ids.includes(d.id) && passes(c, d.when));
  const dims = [...activeConds(c).map(x => ({label: x.cd.label, id: x.cd.id, vals: x.values.map(v => ({v, d: u.by?.[x.cd.id]?.[v]}))})),
                ...drivers.map(d => ({label: d.label, id: d.id, vals: d.values, drv: true}))];
  let out = [{cells: [], cond: {}, d: u.flat}];
  dims.forEach(dim => {
    const next = [];
    out.forEach(r => dim.vals.forEach(v => next.push({cells: [...r.cells, v.v], cond: dim.drv ? r.cond : {...r.cond, [dim.id]: v.v}, d: v.d != null ? v.d : r.d})));
    out = next;
  });
  const bad = r => (c.invalid || []).some(rule => Object.entries(rule).every(([k, vs]) => vs.includes(r.cond[k])));
  out = out.filter(r => !bad(r));
  out.forEach(r => { const hit = (u.byCombo || []).find(x => Object.entries(x.when).every(([k, v]) => r.cond[k] === v)); if (hit) r.d = hit.d; });
  return {dims, rows: out.slice(0, 300), truncated: out.length > 300};
}
function rateTable(c, u){
  const s = st(c), us = s.units[u.id];
  const {dims, rows: rs, truncated} = rows(c, u);
  const key = (r, col) => `${u.id}|${r.cells.join("|")}|${col}`;
  const val = (r, col, dflt) => s.prices[key(r, col)] ?? dflt;
  const cols = us.second ? [["first", "First unit"], ["add", "Each additional"]] : [["p", "Rate"]];
  let h = `<table class="rates"><tr>${dims.map(d => `<th>${esc(d.label)}</th>`).join("")}${cols.map(c2 => `<th>${c2[1]} ($ / ${esc(u.label.toLowerCase())})</th>`).join("")}</tr>`;
  rs.forEach(r => {
    h += `<tr>${r.cells.map(x => `<td>${esc(x)}</td>`).join("")}${cols.map(([col]) => {
      const d = r.d == null ? null : col === "add" ? Math.round(r.d * 50) / 100 : r.d;
      return `<td><input data-act="price" data-c="${c.id}" data-key="${esc(key(r, col))}" value="${fmt(val(r, col, d))}" placeholder="enter"></td>`; }).join("")}</tr>`;
  });
  if (us.min) {
    const d = u.minDefault?.[us.min];
    h += `<tr class="min"><td colspan="${Math.max(dims.length, 1)}">Minimum per ${esc(us.min)}</td><td colspan="${cols.length}"><input data-act="price" data-c="${c.id}" data-key="${u.id}|MIN|${us.min}" value="${fmt(s.prices[`${u.id}|MIN|${us.min}`] ?? d)}" placeholder="enter"></td></tr>`;
  }
  h += `</table><div class="hint">Defaults = benchmark (${esc(u.basis)}; typical ${fmt(u.lo)}–${fmt(u.hi)})${us.second ? ". Additional-unit default is a placeholder at 50% of first." : ""}${truncated ? " · showing first 300 combinations" : ""}</div>`;
  return h;
}

function quoteLines(){
  const L = [];
  all.forEach(c => {
    const s = st(c); if (!s.on) return;
    if (c.kind === "simple") { L.push([byCat(c), c.name, "", c.pct ? "markup" : c.unit, s.price, c.pct]); return; }
    c.units.filter(u => s.units[u.id]?.on && passes(c, u.when)).forEach(u => {
      const us = s.units[u.id], {dims, rows: rs} = rows(c, u);
      const cols = us.second ? [["first", "first"], ["add", "additional"]] : [["p", ""]];
      rs.forEach(r => cols.forEach(([col, lbl]) => {
        const k = `${u.id}|${r.cells.join("|")}|${col}`, d = r.d == null ? null : col === "add" ? Math.round(r.d * 50) / 100 : r.d;
        L.push([byCat(c), c.name, [...dims.map((dm, i) => `${dm.label}: ${r.cells[i]}`), lbl].filter(Boolean).join(" · "), u.label, s.prices[k] ?? d, false]);
      }));
      if (us.min) L.push([byCat(c), c.name, `Minimum charge (${u.label.toLowerCase()} pricing)`, us.min[0].toUpperCase() + us.min.slice(1), s.prices[`${u.id}|MIN|${us.min}`] ?? u.minDefault?.[us.min], false]);
    });
  });
  return L;
}
function byCat(c){ return MODEL.categories.find(x => x.id === c.cat).name; }
function outHTML(){
  const L = quoteLines();
  if (!L.length) return `<span class="hint">Tick charges above to build the quote.</span>`;
  return `<table><tr><th>Category</th><th>Charge</th><th>Condition</th><th>Unit</th><th>Rate</th></tr>` + L.map(l =>
    `<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td><td>${esc(l[3])}</td><td class="r">${l[4] == null ? "<i>enter</i>" : l[5] ? fmt(l[4], true) : money(l[4])}</td></tr>`).join("") + `</table>`;
}

// ---------- events
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t || t.tagName === "INPUT" && t.type !== "checkbox") return;
  const c = byId[t.dataset.c], s = c && st(c), k = t.dataset.k;
  switch (t.dataset.act) {
    case "on": s.on = t.checked; break;
    case "cond": s.conds[k] = s.conds[k] || {values: new Set()}; s.conds[k].on = !s.conds[k].on; break;
    case "condVal": { const set = s.conds[k].values; set.has(t.dataset.v) ? set.delete(t.dataset.v) : set.add(t.dataset.v); break; }
    case "moreConds": s.moreConds = true; break;
    case "moreUnits": s.moreUnits = true; break;
    case "localAll": s.showAll = !s.showAll; break;
    case "unit": s.units[k] = s.units[k] || {}; s.units[k].on = !s.units[k].on; break;
    case "driver": { const us = s.units[t.dataset.u];
      if (showAll(c)) { us.drivers = chosenDrivers(c, us); us.drivers.has(k) ? us.drivers.delete(k) : us.drivers.add(k); }
      else us.driver = k || null; break; }
    case "calc": { const us = s.units[t.dataset.u]; us.calc = us.calc || {}; us.calc[k] = t.dataset.v; break; }
    case "min": s.units[t.dataset.u].min = k || null; break;
    case "second": s.units[t.dataset.u].second = k === "Yes"; break;
    default: return;
  }
  rerender();
});
document.addEventListener("toggle", e => { if (e.target.dataset?.cat) S.open[e.target.dataset.cat] = e.target.open; }, true);
document.addEventListener("change", e => {
  const t = e.target, c = byId[t.dataset.c]; if (!c) return;
  const s = st(c);
  if (t.dataset.act === "sp") { s.price = c.pct ? parseFloat(t.value) / 100 : parseFloat(t.value); rerender(); }
  if (t.dataset.act === "price") { s.prices[t.dataset.key] = t.value === "" ? null : parseFloat(t.value); $("#out .out").innerHTML = outHTML(); $("#sumLines").textContent = quoteLines().length; }
  if (t.dataset.act === "condText") { s.conds[t.dataset.k].text = t.value; rerender(); }
  if (t.dataset.act === "setting") { s.settings[t.dataset.k] = t.value; }
});
$("#showAll").addEventListener("change", e => { S.showAll = e.target.checked; rerender(); });
$("#fac").innerHTML = ["Facility (all)", ...MODEL.categories[1].charges[0].conds.find(x => x.id === "facility").values].map(f => `<option>${esc(f)}</option>`).join("");

// Pre-fill the Offload example so the mockup opens on the reference scenario
(function demo(){
  const s = st(byId["IN-OFFLOAD"]); s.on = true;
  s.conds.offloadType = {on: true, values: new Set(["Palletized"])};
  s.units.pallet = {on: true, driver: null, min: "load"};
  s.units.container = {on: true, driver: "palletCount"};
})();
render();
</script>
